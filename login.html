<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Login</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Poppins", sans-serif;
    }

    body {
      height: 100vh;
      background: url("https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=1600&q=80") no-repeat center center/cover;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      flex-direction: column;
    }

    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      z-index: 0;
    }

    /* Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 40px;
      background: rgba(0, 0, 0, 0.7);
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
    }

    nav .logo-text {
      font-size: 1.8em;
      font-weight: bold;
      color: #fff;
    }

    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
    }

    nav ul li {
      display: inline;
    }

    nav ul li a {
      text-decoration: none;
      color: #fff;
      font-size: 1em;
      transition: 0.3s;
    }

    nav ul li a:hover {
      color: #d4a373;
    }

    .login-btn {
      background-color: #5c3d2e;
      color: #fff !important;
      padding: 8px 15px;
      border-radius: 8px;
      font-weight: bold;
      transition: 0.3s;
    }

    .login-btn:hover {
      background-color: #7b4b37;
    }

    /* Container utama */
    .container {
      position: relative;
      text-align: center;
      color: #fff;
      z-index: 1;
      margin-top: 120px; /* supaya tidak ketutup navbar */
    }

    .logo {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin: auto;
      border: 5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: spin 3s ease-in-out forwards;
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(5px);
    }

    .logo img {
      width: 100px;
      height: 100px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg) scale(0.2); opacity: 0; }
      50% { transform: rotate(360deg) scale(1.1); opacity: 1; }
      100% { transform: rotate(720deg) scale(1); opacity: 1; }
    }

    .login-box {
      margin-top: 30px;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 20px;
      padding: 30px;
      width: 300px;
      margin-left: auto;
      margin-right: auto;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
      display: none;
      animation: fadeInUp 1s ease forwards;
    }

    @keyframes fadeInUp {
      from { transform: translateY(50px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-box h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #fff;
    }

    .input-group {
      margin-bottom: 15px;
      text-align: left;
    }

    .input-group label {
      font-size: 14px;
      color: #ddd;
    }

    .input-group input {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    .btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #ff9800;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.3s;
    }

    .btn:hover {
      background: #e65100;
    }

    .message {
      margin-top: 15px;
      font-size: 14px;
      color: #ffeb3b;
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="logo-text">Culture Coffee ☕</div>
    <ul id="navbar">
      <li><a href="index.html">Home</a></li>
      <li><a href="menu.html">Menu</a></li>
      <li><a href="contact.html">Contact</a></li>
      <li><a href="cart.html">🛒</a></li>
      <li><a href="complain.html">Complain</a></li>
      <li><a href="login.html" class="login-btn">LOGIN</a></li>
    </ul>
  </nav>

  <!-- Login Content -->
  <div class="container">
    <div class="logo">
      <img src="https://cdn-icons-png.flaticon.com/512/924/924514.png" alt="Coffee Logo">
    </div>
    <div class="login-box" id="loginBox">
      <h2>Login</h2>
      <div class="input-group">
        <label>Email</label>
        <input type="email" id="username" placeholder="Masukkan email">
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password" placeholder="Masukkan password">
      </div>
      <button class="btn" onclick="login()">Login</button>
      <p class="message" id="message"></p>
    </div>
  </div>

  <script>
    // Tampilkan login box setelah animasi logo selesai
    setTimeout(() => {
      document.getElementById("loginBox").style.display = "block";
    }, 3000);

    function login() {
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value.trim();
      const message = document.getElementById("message");

      if (username === "admincoffe_culture@gmail.com" && password === "12345") {
        message.style.color = "#4caf50";
        message.textContent = "Login berhasil! Mengarahkan ke Dashboard...";
        setTimeout(() => {
          window.location.href = "dashboard_admin.html";
        }, 1500);
      } else {
        message.style.color = "#f44336";
        message.textContent = "Email atau password salah!";
      }
    }
  </script>
</body>
</html>
